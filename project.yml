name: Fisu
options:
  bundleIdPrefix: fi.fisu
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 6.2
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  Fisu:
    type: application
    platform: iOS
    sources:
      - Fisu
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.fisu.app
        INFOPLIST_FILE: Fisu/Info.plist
        CODE_SIGN_ENTITLEMENTS: Fisu/Fisu.entitlements
        DEVELOPMENT_TEAM: "ZX7D2LKGHP"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: PhotosUI.framework
  FisuTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FisuTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.fisu.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Fisu

schemes:
  Fisu:
    build:
      targets:
        Fisu: all
        FisuTests: [test]
    test:
      targets:
        - FisuTests
