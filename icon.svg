    C 418,264 422,330 464,380
  "
  fill="none" stroke="#ccdae8" stroke-width="2.6"
  stroke-linecap="round" stroke-linejoin="round" opacity="0.70"/>

  <!-- ·· FRONT — rounder fuller loops, close to reel, one line exits ·· -->
  <path d="
