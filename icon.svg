    C 592,284 576,244 548,226
  "
  fill="none" stroke="#c0d2e6" stroke-width="2.0"
  stroke-linecap="round" stroke-linejoin="round" opacity="0.52"/>

  <!-- ·· MID — steep diagonal loops, 45° tilt, cross the back layer ·· -->
  <path d="
    M 494,392
    C 548,354 590,296 578,234
    C 566,174 510,148 460,164
    C 412,180 386,228 396,278
    C 406,328 448,368 500,374
    C 552,380 592,344 596,290
    C 600,238 566,196 520,192
    C 476,188 446,218 450,264
    C 454,310 490,350 536,352
    C 582,354 612,312 606,260
    C 600,210 562,182 520,188
    C 480,194 456,230 464,278
    C 472,324 514,358 558,352
    C 600,346 622,300 610,250
