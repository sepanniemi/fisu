<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: deep water, dark navy to teal -->
    <radialGradient id="bg" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#1c3d60"/>
      <stop offset="100%" stop-color="#06101e"/>
    </radialGradient>

    <!-- Reel body: warm gold/bronze -->
    <radialGradient id="reelBody" cx="36%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#f0c84a"/>
      <stop offset="55%"  stop-color="#c8921c"/>
      <stop offset="100%" stop-color="#7a5408"/>
    </radialGradient>

    <!-- Spool: dark machined aluminium -->
    <radialGradient id="spoolFill" cx="35%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#2a3848"/>
      <stop offset="100%" stop-color="#0c1820"/>
    </radialGradient>

    <!-- Hub cap: small gold circle -->
    <radialGradient id="hub" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#f0c84a"/>
      <stop offset="100%" stop-color="#9a6c10"/>
    </radialGradient>

    <!-- Rod: carbon dark brown -->
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3c2010"/>
      <stop offset="50%"  stop-color="#5a3418"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>

    <!-- Drop shadow for reel -->
    <filter id="reelShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Soft inner glow on reel rim -->
    <filter id="rimGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ─────────────────────────────────────────────── -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle depth shimmer (very faint horizontal ovals) -->
  <ellipse cx="512" cy="820" rx="560" ry="60" fill="#0d2a42" opacity="0.25"/>
  <ellipse cx="512" cy="920" rx="460" ry="45" fill="#0d2a42" opacity="0.18"/>

  <!-- ── ROD ────────────────────────────────────────────────────── -->
  <!-- Main rod body  (lower-left → upper-right) -->
  <line x1="108" y1="910" x2="820" y2="148"
        stroke="url(#rodGrad)" stroke-width="40" stroke-linecap="round"/>
  <!-- Highlight stripe -->
  <line x1="110" y1="908" x2="822" y2="146"
        stroke="#7a4420" stroke-width="12" stroke-linecap="round" opacity="0.45"/>

  <!-- Rod guides (small rings along the blank) -->
  <!-- guide near reel -->
  <g transform="translate(340,572) rotate(-52)">
    <ellipse rx="16" ry="7" fill="none" stroke="#c8a440" stroke-width="4"/>
  </g>
  <!-- guide mid -->
  <g transform="translate(560,358) rotate(-52)">
    <ellipse rx="12" ry="5" fill="none" stroke="#c8a440" stroke-width="3.5"/>
  </g>
  <!-- guide near tip -->
  <g transform="translate(696,232) rotate(-52)">
    <ellipse rx="8"  ry="3.5" fill="none" stroke="#c8a440" stroke-width="3"/>
  </g>

  <!-- ── REEL ────────────────────────────────────────────────────── -->
  <!-- Reel foot / seat (attaches reel to rod blank) -->
  <rect x="408" y="540" width="150" height="44" rx="10"
        fill="#b07c18" transform="rotate(-52,483,562)"/>

  <!-- Reel outer body (main gold disc) -->
  <circle cx="490" cy="598" r="205" fill="url(#reelBody)" filter="url(#reelShadow)"/>

  <!-- Rim accent rings -->
  <circle cx="490" cy="598" r="198" fill="none" stroke="#f8e070" stroke-width="2.5" opacity="0.55" filter="url(#rimGlow)"/>
  <circle cx="490" cy="598" r="190" fill="none" stroke="#7a5408" stroke-width="2"   opacity="0.7"/>

  <!-- Spool recess -->
  <circle cx="490" cy="598" r="162" fill="url(#spoolFill)"/>

  <!-- Monofilament wound on spool (concentric silver lines) -->
  <circle cx="490" cy="598" r="154" fill="none" stroke="#d4dcea" stroke-width="4"   opacity="0.52"/>
  <circle cx="490" cy="598" r="143" fill="none" stroke="#cad2e2" stroke-width="3.5" opacity="0.46"/>
  <circle cx="490" cy="598" r="132" fill="none" stroke="#c0c8d8" stroke-width="3.5" opacity="0.40"/>
  <circle cx="490" cy="598" r="121" fill="none" stroke="#b8c0d0" stroke-width="3"   opacity="0.34"/>
  <circle cx="490" cy="598" r="110" fill="none" stroke="#b0b8c8" stroke-width="3"   opacity="0.28"/>

  <!-- Spool hub ring -->
  <circle cx="490" cy="598" r="58" fill="url(#reelBody)"/>
  <circle cx="490" cy="598" r="50" fill="#141e2c"/>

  <!-- Four spokes from hub to outer edge -->
  <line x1="490" y1="548" x2="490" y2="462" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="490" y1="648" x2="490" y2="734" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="440" y1="598" x2="354" y2="598" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="540" y1="598" x2="626" y2="598" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>

  <!-- Hub cap -->
  <circle cx="490" cy="598" r="26" fill="url(#hub)"/>
  <circle cx="490" cy="598" r="14" fill="#0c1420"/>
  <circle cx="490" cy="598" r="6"  fill="url(#hub)"/>

  <!-- Handle arm -->
  <rect x="630" y="576" width="110" height="20" rx="10" fill="#d4a020"/>
  <!-- Handle knob -->
  <circle cx="745" cy="586" r="32" fill="#c8921c" stroke="#8a6010" stroke-width="3.5"/>
  <circle cx="745" cy="586" r="20" fill="#141e2c"/>
  <circle cx="745" cy="586" r="9"  fill="#c8921c"/>

  <!-- Specular highlight on reel (upper-left white sheen) -->
  <ellipse cx="420" cy="530" rx="48" ry="28" fill="white" opacity="0.07"
           transform="rotate(-35,420,530)"/>

  <!-- ── TANGLED FISHING LINES — three layered strands for 3D depth ── -->
  <!-- Back layer (dark, upper-left):  appears furthest from viewer     -->
  <!-- Mid layer  (grey, centred):     appears mid-depth                -->
  <!-- Front layer (bright, lower):    appears closest; one end exits   -->
  <!-- Layering order + colour + spatial offset = 3D pile illusion      -->

  <!-- ·· BACK LAYER — dark blue-grey, thinnest, shifted upper-left ·· -->
  <path d="
    M 468,393
    C 440,374 400,345 374,312
    C 347,278 344,242 364,218
    C 384,195 414,190 440,204
    C 468,218 480,248 472,274
    C 464,300 444,318 422,316
    C 400,314 382,296 384,272
    C 386,248 404,232 424,236
    C 444,240 456,262 450,286
    C 444,310 428,324 410,318
    C 392,312 382,292 390,270
    C 398,248 418,238 438,246
    C 458,254 466,278 458,300
    C 450,322 430,334 412,326
    C 394,318 386,296 396,275
    C 406,254 428,246 448,256
    C 468,266 474,292 464,316
    C 454,338 432,348 410,338
    C 390,328 382,304 394,282
    C 406,260 430,254 452,266
    C 474,278 478,306 466,330
    C 454,352 430,360 408,348
    C 386,336 380,308 394,286
    C 408,264 434,258 458,272
    C 480,286 484,316 470,340
    C 456,362 430,368 406,354
    C 382,340 376,310 390,286
    C 404,263 430,258 455,273
  "
  fill="none" stroke="#607888" stroke-width="2.2"
  stroke-linecap="round" stroke-linejoin="round" opacity="0.40"/>

  <!-- ·· MID LAYER — medium silver, centred, crosses both others ·· -->
  <path d="
    M 494,397
    C 526,380 560,350 574,314
    C 588,278 578,240 554,218
    C 530,196 500,194 478,210
    C 456,226 446,256 452,284
    C 458,312 476,334 500,338
    C 524,342 546,326 556,300
    C 566,274 556,246 536,232
    C 516,218 492,220 474,238
    C 456,256 452,284 464,310
    C 476,336 500,350 524,346
    C 548,342 564,318 560,290
    C 556,262 536,244 512,246
    C 488,248 470,268 470,296
    C 470,324 490,346 516,348
    C 542,350 562,328 558,300
    C 554,272 530,254 506,258
    C 482,262 466,284 470,312
    C 474,338 498,354 524,350
    C 550,346 566,322 560,294
    C 554,266 528,250 504,256
    C 480,262 466,286 472,314
    C 478,342 504,358 530,352
    C 556,346 570,320 562,290
    C 554,262 526,246 502,254
    C 478,262 464,288 472,318
    C 480,346 506,362 532,356
    C 558,350 572,322 563,292
    C 554,264 525,250 500,258
    C 476,267 463,295 472,324
  "
  fill="none" stroke="#98aec4" stroke-width="2.7"
  stroke-linecap="round" stroke-linejoin="round" opacity="0.62"/>

  <!-- ·· FRONT LAYER — bright, lowest/closest, exits toward rod tip ·· -->
  <path d="
    M 492,400
    C 462,386 422,358 398,326
    C 374,294 370,256 390,232
    C 410,208 442,202 468,218
    C 496,234 512,264 506,294
    C 500,324 480,346 456,348
    C 432,350 410,332 406,306
    C 402,280 420,256 446,252
    C 472,248 494,268 500,298
    C 506,328 490,354 464,358
    C 438,362 414,342 410,314
    C 406,286 426,262 452,260
    C 478,258 500,280 504,312
    C 508,344 490,368 462,368
    C 434,368 412,344 412,316
    C 412,288 434,266 460,266
    C 486,266 508,290 510,322
    C 512,354 492,376 464,374
    C 436,372 414,348 416,320
    C 418,292 442,272 468,274
    C 494,276 514,302 514,334
    C 514,364 492,382 464,378
    C 436,374 416,348 420,320
    C 424,292 450,274 476,278
    C 502,282 520,310 518,342
    C 516,370 494,384 466,378
    C 440,372 422,344 428,316
    C 434,290 460,276 486,282
    C 512,288 526,318 522,350
    C 518,378 494,390 468,382
    C 444,374 430,346 438,320
    C 446,294 472,282 498,290
    C 516,272 538,248 562,222
    C 590,192 624,168 660,148
  "
  fill="none" stroke="#dce8f8" stroke-width="3.2"
  stroke-linecap="round" stroke-linejoin="round" opacity="0.93"/>
</svg>
