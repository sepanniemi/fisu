    C 534,218 504,200 472,204
    C 440,208 416,236 412,272
    C 408,308 432,350 470,364
    C 506,378 548,368 574,342
    C 600,316 602,274 582,244
    C 562,214 528,200 496,208
    C 464,216 444,248 444,286
