<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: deep water, dark navy to teal -->
    <radialGradient id="bg" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#1c3d60"/>
      <stop offset="100%" stop-color="#06101e"/>
    </radialGradient>

    <!-- Reel body: warm gold/bronze -->
    <radialGradient id="reelBody" cx="36%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#f0c84a"/>
      <stop offset="55%"  stop-color="#c8921c"/>
      <stop offset="100%" stop-color="#7a5408"/>
    </radialGradient>

    <!-- Spool: dark machined aluminium -->
    <radialGradient id="spoolFill" cx="35%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#2a3848"/>
      <stop offset="100%" stop-color="#0c1820"/>
    </radialGradient>

    <!-- Hub cap: small gold circle -->
    <radialGradient id="hub" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#f0c84a"/>
      <stop offset="100%" stop-color="#9a6c10"/>
    </radialGradient>

    <!-- Rod: carbon dark brown -->
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3c2010"/>
      <stop offset="50%"  stop-color="#5a3418"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>

    <!-- Drop shadow for reel -->
    <filter id="reelShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Soft inner glow on reel rim -->
    <filter id="rimGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ─────────────────────────────────────────────── -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle depth shimmer (very faint horizontal ovals) -->
  <ellipse cx="512" cy="820" rx="560" ry="60" fill="#0d2a42" opacity="0.25"/>
  <ellipse cx="512" cy="920" rx="460" ry="45" fill="#0d2a42" opacity="0.18"/>

  <!-- ── ROD ────────────────────────────────────────────────────── -->
  <!-- Main rod body  (lower-left → upper-right) -->
  <line x1="108" y1="910" x2="820" y2="148"
        stroke="url(#rodGrad)" stroke-width="40" stroke-linecap="round"/>
  <!-- Highlight stripe -->
  <line x1="110" y1="908" x2="822" y2="146"
        stroke="#7a4420" stroke-width="12" stroke-linecap="round" opacity="0.45"/>

  <!-- Rod guides (small rings along the blank) -->
  <!-- guide near reel -->
  <g transform="translate(340,572) rotate(-52)">
    <ellipse rx="16" ry="7" fill="none" stroke="#c8a440" stroke-width="4"/>
  </g>
  <!-- guide mid -->
  <g transform="translate(560,358) rotate(-52)">
    <ellipse rx="12" ry="5" fill="none" stroke="#c8a440" stroke-width="3.5"/>
  </g>
  <!-- guide near tip -->
  <g transform="translate(696,232) rotate(-52)">
    <ellipse rx="8"  ry="3.5" fill="none" stroke="#c8a440" stroke-width="3"/>
  </g>

  <!-- ── REEL ────────────────────────────────────────────────────── -->
  <!-- Reel foot / seat (attaches reel to rod blank) -->
  <rect x="408" y="540" width="150" height="44" rx="10"
        fill="#b07c18" transform="rotate(-52,483,562)"/>

  <!-- Reel outer body (main gold disc) -->
  <circle cx="490" cy="598" r="205" fill="url(#reelBody)" filter="url(#reelShadow)"/>

  <!-- Rim accent rings -->
  <circle cx="490" cy="598" r="198" fill="none" stroke="#f8e070" stroke-width="2.5" opacity="0.55" filter="url(#rimGlow)"/>
  <circle cx="490" cy="598" r="190" fill="none" stroke="#7a5408" stroke-width="2"   opacity="0.7"/>

  <!-- Spool recess -->
  <circle cx="490" cy="598" r="162" fill="url(#spoolFill)"/>

  <!-- Monofilament wound on spool (concentric silver lines) -->
  <circle cx="490" cy="598" r="154" fill="none" stroke="#d4dcea" stroke-width="4"   opacity="0.52"/>
  <circle cx="490" cy="598" r="143" fill="none" stroke="#cad2e2" stroke-width="3.5" opacity="0.46"/>
  <circle cx="490" cy="598" r="132" fill="none" stroke="#c0c8d8" stroke-width="3.5" opacity="0.40"/>
  <circle cx="490" cy="598" r="121" fill="none" stroke="#b8c0d0" stroke-width="3"   opacity="0.34"/>
  <circle cx="490" cy="598" r="110" fill="none" stroke="#b0b8c8" stroke-width="3"   opacity="0.28"/>

  <!-- Spool hub ring -->
  <circle cx="490" cy="598" r="58" fill="url(#reelBody)"/>
  <circle cx="490" cy="598" r="50" fill="#141e2c"/>

  <!-- Four spokes from hub to outer edge -->
  <line x1="490" y1="548" x2="490" y2="462" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="490" y1="648" x2="490" y2="734" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="440" y1="598" x2="354" y2="598" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="540" y1="598" x2="626" y2="598" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>

  <!-- Hub cap -->
  <circle cx="490" cy="598" r="26" fill="url(#hub)"/>
  <circle cx="490" cy="598" r="14" fill="#0c1420"/>
  <circle cx="490" cy="598" r="6"  fill="url(#hub)"/>

  <!-- Handle arm -->
  <rect x="630" y="576" width="110" height="20" rx="10" fill="#d4a020"/>
  <!-- Handle knob -->
  <circle cx="745" cy="586" r="32" fill="#c8921c" stroke="#8a6010" stroke-width="3.5"/>
  <circle cx="745" cy="586" r="20" fill="#141e2c"/>
  <circle cx="745" cy="586" r="9"  fill="#c8921c"/>

  <!-- Specular highlight on reel (upper-left white sheen) -->
  <ellipse cx="420" cy="530" rx="48" ry="28" fill="white" opacity="0.07"
           transform="rotate(-35,420,530)"/>

  <!-- ── TANGLED FISHING LINES ──────────────────────────────────── -->
  <!-- All tangles concentrated ABOVE the reel (y < ~410).             -->
  <!-- Lines leave the spool top (~490,393) and tangle in the upper    -->
  <!-- zone before reaching the rod tip. Reel face stays visible.      -->

  <!-- ·· Wide outer loops filling the upper area ·· -->
  <path d="M 490 400 C 440 350 340 310 260 260 C 200 220 170 170 210 140 C 250 110 320 130 360 180 C 400 228 390 300 440 340"
        fill="none" stroke="#dce8f8" stroke-width="3" stroke-linecap="round" opacity="0.88"/>
  <path d="M 500 395 C 560 340 660 290 740 230 C 800 180 820 130 790 100 C 760 72 700 88 660 130 C 620 170 620 240 570 280"
        fill="none" stroke="#d8e4f6" stroke-width="2.9" stroke-linecap="round" opacity="0.84"/>
  <path d="M 470 405 C 400 370 300 360 240 310 C 180 260 180 200 220 170 C 260 140 320 160 340 210"
        fill="none" stroke="#d0dced" stroke-width="2.7" stroke-linecap="round" opacity="0.80"/>
  <path d="M 510 400 C 590 360 700 340 760 290 C 820 240 830 180 800 150 C 770 120 720 132 690 168"
        fill="none" stroke="#ccd8ea" stroke-width="2.7" stroke-linecap="round" opacity="0.78"/>

  <!-- ·· Mid-size loops criss-crossing the upper zone ·· -->
  <path d="M 450 398 C 380 350 330 270 370 210 C 410 150 490 158 520 210 C 548 258 518 330 470 360"
        fill="none" stroke="#e0eaf8" stroke-width="2.6" stroke-linecap="round" opacity="0.86"/>
  <path d="M 530 396 C 600 348 660 270 630 210 C 600 150 524 152 498 204 C 474 252 502 326 548 356"
        fill="none" stroke="#dce6f4" stroke-width="2.5" stroke-linecap="round" opacity="0.83"/>
  <path d="M 440 402 C 360 368 290 300 308 238 C 326 176 402 164 440 206 C 472 242 460 308 420 340"
        fill="none" stroke="#d8e2f2" stroke-width="2.4" stroke-linecap="round" opacity="0.79"/>
  <path d="M 545 398 C 624 362 692 294 674 232 C 656 170 580 160 542 202 C 508 240 522 308 562 338"
        fill="none" stroke="#d4deee" stroke-width="2.4" stroke-linecap="round" opacity="0.76"/>

  <!-- ·· Tighter loops knotting up in the middle upper zone ·· -->
  <path d="M 460 400 C 414 366 390 310 416 268 C 442 226 500 228 518 268 C 534 304 512 354 474 374"
        fill="none" stroke="#e4ecfa" stroke-width="2.3" stroke-linecap="round" opacity="0.90"/>
  <path d="M 522 398 C 568 364 592 308 566 266 C 540 224 482 226 464 266 C 448 302 470 352 508 372"
        fill="none" stroke="#e0eaf8" stroke-width="2.3" stroke-linecap="round" opacity="0.87"/>
  <path d="M 448 403 C 398 378 370 326 390 282 C 410 238 462 232 490 264 C 514 292 506 346 466 368"
        fill="none" stroke="#dce8f6" stroke-width="2.2" stroke-linecap="round" opacity="0.84"/>
  <path d="M 534 401 C 584 376 612 324 592 280 C 572 236 520 230 492 262 C 468 290 476 344 516 366"
        fill="none" stroke="#d8e4f2" stroke-width="2.2" stroke-linecap="round" opacity="0.81"/>

  <!-- ·· Small tight knots right where line leaves the spool top ·· -->
  <path d="M 478 400 C 452 378 444 344 462 320 C 480 296 514 298 524 322 C 532 344 518 374 492 386"
        fill="none" stroke="#e8f2fc" stroke-width="2.1" stroke-linecap="round" opacity="0.92"/>
  <path d="M 502 398 C 528 376 536 342 518 318 C 500 294 466 296 456 320 C 448 342 462 372 488 384"
        fill="none" stroke="#e4eefa" stroke-width="2.1" stroke-linecap="round" opacity="0.89"/>
  <path d="M 468 402 C 436 386 422 352 438 326 C 454 300 494 298 508 322 C 520 344 506 378 476 392"
        fill="none" stroke="#e0ecf8" stroke-width="2"   stroke-linecap="round" opacity="0.86"/>
  <path d="M 514 400 C 546 382 560 350 546 322 C 532 296 492 296 478 320 C 466 342 480 376 510 390"
        fill="none" stroke="#dce8f6" stroke-width="2"   stroke-linecap="round" opacity="0.83"/>

  <!-- ·· Short chaotic crossing segments — bird's-nest density ·· -->
  <path d="M 430 370 C 452 348 476 356 474 378" fill="none" stroke="#e8f2fc" stroke-width="1.9" stroke-linecap="round" opacity="0.88"/>
  <path d="M 550 368 C 528 346 504 356 506 378" fill="none" stroke="#e4eef8" stroke-width="1.9" stroke-linecap="round" opacity="0.85"/>
  <path d="M 490 340 C 514 318 536 328 530 352" fill="none" stroke="#e0eaf6" stroke-width="1.8" stroke-linecap="round" opacity="0.82"/>
  <path d="M 490 340 C 466 318 444 330 450 354" fill="none" stroke="#dce6f4" stroke-width="1.8" stroke-linecap="round" opacity="0.80"/>
  <path d="M 458 308 C 480 290 506 300 500 322" fill="none" stroke="#e4eef8" stroke-width="1.8" stroke-linecap="round" opacity="0.82"/>
  <path d="M 522 308 C 500 290 474 302 480 324" fill="none" stroke="#e0eaf6" stroke-width="1.8" stroke-linecap="round" opacity="0.80"/>
  <path d="M 412 320 C 438 300 462 314 454 338" fill="none" stroke="#dce6f2" stroke-width="1.7" stroke-linecap="round" opacity="0.76"/>
  <path d="M 568 318 C 542 298 518 314 526 338" fill="none" stroke="#d8e2f0" stroke-width="1.7" stroke-linecap="round" opacity="0.74"/>
  <path d="M 390 270 C 418 252 444 268 436 294" fill="none" stroke="#d8e4f2" stroke-width="1.7" stroke-linecap="round" opacity="0.72"/>
  <path d="M 590 268 C 562 250 538 268 546 292" fill="none" stroke="#d4e0ee" stroke-width="1.7" stroke-linecap="round" opacity="0.70"/>
  <path d="M 360 230 C 390 210 418 228 408 256" fill="none" stroke="#d4dff0" stroke-width="1.6" stroke-linecap="round" opacity="0.68"/>
  <path d="M 620 228 C 590 208 562 228 572 254" fill="none" stroke="#d0dbec" stroke-width="1.6" stroke-linecap="round" opacity="0.66"/>
  <path d="M 310 190 C 344 170 372 190 360 218" fill="none" stroke="#ccd8e8" stroke-width="1.6" stroke-linecap="round" opacity="0.62"/>
  <path d="M 670 188 C 636 168 608 190 620 216" fill="none" stroke="#c8d4e4" stroke-width="1.6" stroke-linecap="round" opacity="0.60"/>
  <path d="M 474 250 C 494 232 516 244 508 268" fill="none" stroke="#e0eaf6" stroke-width="1.7" stroke-linecap="round" opacity="0.78"/>
  <path d="M 444 210 C 468 192 494 206 484 232" fill="none" stroke="#dce6f2" stroke-width="1.7" stroke-linecap="round" opacity="0.74"/>
  <path d="M 536 210 C 512 190 488 206 498 232" fill="none" stroke="#d8e2f0" stroke-width="1.7" stroke-linecap="round" opacity="0.72"/>
</svg>
