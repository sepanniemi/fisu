<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Background: deep water, dark navy to teal -->
    <radialGradient id="bg" cx="38%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#1c3d60"/>
      <stop offset="100%" stop-color="#06101e"/>
    </radialGradient>

    <!-- Reel body: warm gold/bronze -->
    <radialGradient id="reelBody" cx="36%" cy="32%" r="68%">
      <stop offset="0%"   stop-color="#f0c84a"/>
      <stop offset="55%"  stop-color="#c8921c"/>
      <stop offset="100%" stop-color="#7a5408"/>
    </radialGradient>

    <!-- Spool: dark machined aluminium -->
    <radialGradient id="spoolFill" cx="35%" cy="32%" r="65%">
      <stop offset="0%"   stop-color="#2a3848"/>
      <stop offset="100%" stop-color="#0c1820"/>
    </radialGradient>

    <!-- Hub cap: small gold circle -->
    <radialGradient id="hub" cx="35%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#f0c84a"/>
      <stop offset="100%" stop-color="#9a6c10"/>
    </radialGradient>

    <!-- Rod: carbon dark brown -->
    <linearGradient id="rodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3c2010"/>
      <stop offset="50%"  stop-color="#5a3418"/>
      <stop offset="100%" stop-color="#1a0c04"/>
    </linearGradient>

    <!-- Drop shadow for reel -->
    <filter id="reelShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="4" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.6"/>
    </filter>

    <!-- Soft inner glow on reel rim -->
    <filter id="rimGlow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── BACKGROUND ─────────────────────────────────────────────── -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Subtle depth shimmer (very faint horizontal ovals) -->
  <ellipse cx="512" cy="820" rx="560" ry="60" fill="#0d2a42" opacity="0.25"/>
  <ellipse cx="512" cy="920" rx="460" ry="45" fill="#0d2a42" opacity="0.18"/>

  <!-- ── ROD ────────────────────────────────────────────────────── -->
  <!-- Main rod body  (lower-left → upper-right) -->
  <line x1="108" y1="910" x2="820" y2="148"
        stroke="url(#rodGrad)" stroke-width="24" stroke-linecap="round"/>
  <!-- Highlight stripe -->
  <line x1="110" y1="908" x2="822" y2="146"
        stroke="#7a4420" stroke-width="7" stroke-linecap="round" opacity="0.45"/>

  <!-- Rod guides (small rings along the blank) -->
  <!-- guide near reel -->
  <g transform="translate(340,572) rotate(-52)">
    <ellipse rx="16" ry="7" fill="none" stroke="#c8a440" stroke-width="4"/>
  </g>
  <!-- guide mid -->
  <g transform="translate(560,358) rotate(-52)">
    <ellipse rx="12" ry="5" fill="none" stroke="#c8a440" stroke-width="3.5"/>
  </g>
  <!-- guide near tip -->
  <g transform="translate(696,232) rotate(-52)">
    <ellipse rx="8"  ry="3.5" fill="none" stroke="#c8a440" stroke-width="3"/>
  </g>

  <!-- ── REEL ────────────────────────────────────────────────────── -->
  <!-- Reel foot / seat (attaches reel to rod blank) -->
  <rect x="408" y="540" width="150" height="44" rx="10"
        fill="#b07c18" transform="rotate(-52,483,562)"/>

  <!-- Reel outer body (main gold disc) -->
  <circle cx="490" cy="598" r="205" fill="url(#reelBody)" filter="url(#reelShadow)"/>

  <!-- Rim accent rings -->
  <circle cx="490" cy="598" r="198" fill="none" stroke="#f8e070" stroke-width="2.5" opacity="0.55" filter="url(#rimGlow)"/>
  <circle cx="490" cy="598" r="190" fill="none" stroke="#7a5408" stroke-width="2"   opacity="0.7"/>

  <!-- Spool recess -->
  <circle cx="490" cy="598" r="162" fill="url(#spoolFill)"/>

  <!-- Monofilament wound on spool (concentric silver lines) -->
  <circle cx="490" cy="598" r="154" fill="none" stroke="#d4dcea" stroke-width="4"   opacity="0.52"/>
  <circle cx="490" cy="598" r="143" fill="none" stroke="#cad2e2" stroke-width="3.5" opacity="0.46"/>
  <circle cx="490" cy="598" r="132" fill="none" stroke="#c0c8d8" stroke-width="3.5" opacity="0.40"/>
  <circle cx="490" cy="598" r="121" fill="none" stroke="#b8c0d0" stroke-width="3"   opacity="0.34"/>
  <circle cx="490" cy="598" r="110" fill="none" stroke="#b0b8c8" stroke-width="3"   opacity="0.28"/>

  <!-- Spool hub ring -->
  <circle cx="490" cy="598" r="58" fill="url(#reelBody)"/>
  <circle cx="490" cy="598" r="50" fill="#141e2c"/>

  <!-- Four spokes from hub to outer edge -->
  <line x1="490" y1="548" x2="490" y2="462" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="490" y1="648" x2="490" y2="734" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="440" y1="598" x2="354" y2="598" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>
  <line x1="540" y1="598" x2="626" y2="598" stroke="#c8921c" stroke-width="14" stroke-linecap="round"/>

  <!-- Hub cap -->
  <circle cx="490" cy="598" r="26" fill="url(#hub)"/>
  <circle cx="490" cy="598" r="14" fill="#0c1420"/>
  <circle cx="490" cy="598" r="6"  fill="url(#hub)"/>

  <!-- Handle arm -->
  <rect x="630" y="576" width="110" height="20" rx="10" fill="#d4a020"/>
  <!-- Handle knob -->
  <circle cx="745" cy="586" r="32" fill="#c8921c" stroke="#8a6010" stroke-width="3.5"/>
  <circle cx="745" cy="586" r="20" fill="#141e2c"/>
  <circle cx="745" cy="586" r="9"  fill="#c8921c"/>

  <!-- Specular highlight on reel (upper-left white sheen) -->
  <ellipse cx="420" cy="530" rx="48" ry="28" fill="white" opacity="0.07"
           transform="rotate(-35,420,530)"/>

  <!-- ── TANGLED FISHING LINES ──────────────────────────────────── -->
  <!-- Dense pile of tangled monofilament over the reel. Reel center: 490,598 -->

  <!-- ·· Layer 1 — wide sprawling loops that establish the outer tangle ·· -->
  <path d="M 490 393 C 560 340 640 300 700 250 C 740 210 760 180 720 160"
        fill="none" stroke="#dce8f8" stroke-width="3" stroke-linecap="round" opacity="0.90"/>
  <path d="M 350 470 C 260 420 210 330 255 260 C 300 190 400 200 440 265 C 470 315 448 390 395 430"
        fill="none" stroke="#d4e0f0" stroke-width="2.8" stroke-linecap="round" opacity="0.86"/>
  <path d="M 620 460 C 700 400 760 370 780 420 C 800 470 760 520 700 508 C 648 496 622 466 638 448"
        fill="none" stroke="#ccd6ea" stroke-width="2.6" stroke-linecap="round" opacity="0.82"/>
  <path d="M 310 530 C 240 570 210 650 255 710 C 300 770 390 762 420 704 C 446 652 412 590 356 600"
        fill="none" stroke="#c8d4e8" stroke-width="2.6" stroke-linecap="round" opacity="0.78"/>
  <path d="M 630 700 C 690 740 720 800 695 850 C 668 900 618 888 604 848 C 590 810 622 774 656 758"
        fill="none" stroke="#c0cce0" stroke-width="2.4" stroke-linecap="round" opacity="0.72"/>

  <!-- ·· Layer 2 — tighter loops crossing directly over the reel body ·· -->
  <path d="M 420 460 C 360 400 340 470 390 510 C 430 540 490 520 510 470 C 528 424 500 380 460 390"
        fill="none" stroke="#e0eaf8" stroke-width="2.5" stroke-linecap="round" opacity="0.88"/>
  <path d="M 560 440 C 620 400 650 460 614 506 C 578 550 514 542 498 490 C 482 440 520 400 560 418"
        fill="none" stroke="#d8e4f4" stroke-width="2.4" stroke-linecap="round" opacity="0.84"/>
  <path d="M 430 640 C 380 690 390 760 440 780 C 490 800 545 768 548 718 C 550 672 514 642 474 656"
        fill="none" stroke="#d0dced" stroke-width="2.4" stroke-linecap="round" opacity="0.80"/>
  <path d="M 548 630 C 600 680 600 750 554 768 C 508 786 462 754 468 708 C 474 664 522 648 548 668"
        fill="none" stroke="#c8d4e6" stroke-width="2.3" stroke-linecap="round" opacity="0.76"/>

  <!-- ·· Layer 3 — small tight knot-like loops right on top of spool ·· -->
  <path d="M 470 520 C 438 500 424 530 446 554 C 466 576 502 570 510 546 C 518 522 498 502 472 510"
        fill="none" stroke="#e8f0fc" stroke-width="2.2" stroke-linecap="round" opacity="0.92"/>
  <path d="M 510 544 C 544 522 556 548 540 572 C 524 596 492 592 484 566 C 476 542 498 524 518 534"
        fill="none" stroke="#e4ecfa" stroke-width="2.2" stroke-linecap="round" opacity="0.88"/>
  <path d="M 450 578 C 416 558 408 590 428 616 C 448 640 484 636 492 610 C 500 584 474 562 452 572"
        fill="none" stroke="#e0eaf8" stroke-width="2.1" stroke-linecap="round" opacity="0.85"/>
  <path d="M 520 600 C 558 580 568 612 550 638 C 532 662 498 656 492 630 C 486 606 508 586 528 596"
        fill="none" stroke="#dce8f6" stroke-width="2.1" stroke-linecap="round" opacity="0.82"/>

  <!-- ·· Layer 4 — crossing arcs that weave between layers ·· -->
  <path d="M 340 480 C 370 510 430 498 440 460 C 450 424 420 394 386 406 C 354 418 344 454 362 472"
        fill="none" stroke="#d8e2f2" stroke-width="2" stroke-linecap="round" opacity="0.78"/>
  <path d="M 630 510 C 668 538 670 586 636 604 C 602 622 564 600 562 566 C 560 534 592 516 622 528"
        fill="none" stroke="#d4deee" stroke-width="2" stroke-linecap="round" opacity="0.74"/>
  <path d="M 480 430 C 520 408 550 430 544 464 C 538 496 506 508 480 492 C 456 476 452 444 472 432"
        fill="none" stroke="#dce6f4" stroke-width="2" stroke-linecap="round" opacity="0.80"/>
  <path d="M 460 668 C 440 700 452 738 484 746 C 516 754 546 728 540 696 C 534 664 504 652 478 664"
        fill="none" stroke="#ccd6e8" stroke-width="2" stroke-linecap="round" opacity="0.70"/>

  <!-- ·· Layer 5 — short chaotic crossing segments for maximum tangle feel ·· -->
  <path d="M 380 544 C 406 528 416 556 396 572" fill="none" stroke="#e4ecfa" stroke-width="1.9" stroke-linecap="round" opacity="0.82"/>
  <path d="M 594 544 C 568 528 560 558 580 572" fill="none" stroke="#e0eaf8" stroke-width="1.9" stroke-linecap="round" opacity="0.78"/>
  <path d="M 490 480 C 522 464 532 492 510 508" fill="none" stroke="#e8f0fc" stroke-width="1.8" stroke-linecap="round" opacity="0.85"/>
  <path d="M 452 534 C 470 512 494 518 490 542" fill="none" stroke="#e4ecfa" stroke-width="1.8" stroke-linecap="round" opacity="0.80"/>
  <path d="M 528 540 C 510 518 488 526 490 552" fill="none" stroke="#e0e8f8" stroke-width="1.8" stroke-linecap="round" opacity="0.78"/>
  <path d="M 460 622 C 480 604 508 614 502 638" fill="none" stroke="#dce4f2" stroke-width="1.8" stroke-linecap="round" opacity="0.74"/>
  <path d="M 520 618 C 500 602 474 614 480 638" fill="none" stroke="#d8e0ee" stroke-width="1.8" stroke-linecap="round" opacity="0.72"/>
  <path d="M 414 600 C 400 572 420 552 442 566" fill="none" stroke="#dce6f4" stroke-width="1.8" stroke-linecap="round" opacity="0.76"/>
  <path d="M 566 598 C 582 572 562 552 540 568" fill="none" stroke="#d8e2f0" stroke-width="1.8" stroke-linecap="round" opacity="0.74"/>
  <path d="M 476 450 C 456 432 436 448 448 468" fill="none" stroke="#e0eaf8" stroke-width="1.7" stroke-linecap="round" opacity="0.76"/>
  <path d="M 504 452 C 524 434 546 450 532 470" fill="none" stroke="#dce8f6" stroke-width="1.7" stroke-linecap="round" opacity="0.74"/>
  <path d="M 362 560 C 346 538 360 514 380 524" fill="none" stroke="#d8e2f0" stroke-width="1.7" stroke-linecap="round" opacity="0.68"/>
  <path d="M 618 558 C 636 536 622 512 602 524" fill="none" stroke="#d4deeC" stroke-width="1.7" stroke-linecap="round" opacity="0.66"/>
  <path d="M 488 680 C 468 664 448 674 454 698" fill="none" stroke="#ccd6e6" stroke-width="1.7" stroke-linecap="round" opacity="0.66"/>
  <path d="M 502 678 C 524 664 542 674 536 698" fill="none" stroke="#c8d2e2" stroke-width="1.7" stroke-linecap="round" opacity="0.64"/>
</svg>
